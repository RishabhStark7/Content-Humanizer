[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human-writing-engine"
version = "1.0.0"
description = "Production-grade Human Writing Engine for long-form content generation and local reconstruction"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Human Writing Engine Team", email = "editorial@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
]
dependencies = [
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.0",
    "google-genai>=1.0.0",
    "nltk>=3.8.1",
    "textstat>=0.7.3",
    "RapidFuzz>=3.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
humanize = "src.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
